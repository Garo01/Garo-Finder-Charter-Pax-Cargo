[build]
  publish = "."
  command = "echo 'Static site — no build'"

[[headers]]
  for = "/*.bin.gz"
  [headers.values]
    Content-Type = "application/gzip"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/charter"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/pax"
  to = "/paxcargo.html"
  status = 200

[[redirects]]
  from = "/cargo"
  to = "/paxcargo.html"
  status = 200
